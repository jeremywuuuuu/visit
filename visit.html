<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>裕安 · 走访登记</title>
<style>
body{font-family:'Microsoft YaHei',sans-serif;display:flex;align-items:center;justify-content:center;flex-direction:column;height:100vh;background:#eef2f7;margin:0}
.spin{width:38px;height:38px;border:4px solid #b9d4ee;border-top-color:#0a4da3;border-radius:50%;animation:r 1s linear infinite;margin-bottom:18px}
@keyframes r{to{transform:rotate(360deg)}}
.d{color:#0a4da3;font-size:18px;font-weight:700}
.s{color:#8898aa;font-size:12.5px;margin-top:10px;text-align:center;line-height:1.7}
.btn{margin-top:16px;background:#0a4da3;color:#fff;border:none;border-radius:8px;padding:9px 22px;font-size:14px;display:none}
</style></head><body>
<div class="spin" id="sp"></div>
<div class="d" id="msg">正在打开走访系统…</div>
<div class="s" id="sub">首次打开约需1-2秒，请稍候</div>
<button class="btn" id="retry" onclick="go(0)">重新加载</button>
<script>
var qs = location.search;
var tries = 0;
function go(n){
  tries = n;
  document.getElementById('sp').style.display='block';
  document.getElementById('msg').textContent = n>0 ? ('正在重连（第'+n+'次）…') : '正在打开走访系统…';
  document.getElementById('sub').textContent = n>0 ? '服务器正在恢复中，稍等几秒会自动连上' : '首次打开约需1-2秒，请稍候';
  document.getElementById('retry').style.display='none';
  fetch('./current.json?ts=' + Date.now(), {cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    var target = d.tunnel + '/visit.html' + qs;
    // 先探测目标是否可用（避免直接跳转到错误页）
    var img = new Image();
    var done = false;
    var timer = setTimeout(function(){ if(!done){ done=true; retry(); } }, 6000);
    fetch(target, {method:'GET', mode:'no-cors', cache:'no-store'}).then(function(){
      if(!done){ done=true; clearTimeout(timer); location.replace(target); }
    }).catch(function(){
      if(!done){ done=true; clearTimeout(timer); retry(); }
    });
  }).catch(function(){ retry(); });
}
function retry(){
  if (tries < 12){
    document.getElementById('msg').textContent = '服务器启动中…';
    document.getElementById('sub').textContent = '系统正在自动恢复（约1-2分钟），页面会自动重连，无需操作';
    setTimeout(function(){ go(tries+1); }, 5000);
  } else {
    document.getElementById('sp').style.display='none';
    document.getElementById('msg').textContent = '暂时无法连接';
    document.getElementById('sub').textContent = '系统正在自动修复，请1分钟后刷新本页，或联系中心管理员';
    document.getElementById('retry').style.display='inline-block';
  }
}
go(0);
</script></body></html>
